<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pkmnHub | Cadastro</title>
    <link rel="icon" href="./assets/imgs/main/logo.png">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bodyCadastro2">
    <main class="cadastroContainer">
        <section class="formularioCadastro">
            <div class="logo logo--form">
                <img src="./assets/imgs/main/logo.png">
                <a href="index.html" style="color: var(--accent-blue);">pkmnHub</a>
            </div>

            <div class="welcome-text">
                <h1>Comece sua Jornada</h1>
                <p>Escolha seu inicial!</p>
            </div>

            <form onsubmit="return false;">
                <label>USERNAME</label>
                <input type="text" id="ipt_username" placeholder="Ex: Red1996">

                <label>E-MAIL</label>
                <input type="text" id="ipt_email" placeholder="nome@exemplo.com">

                <div class="inputsJuntos">
                    <div class="espaco">
                        <label>SENHA</label>
                        <input type="password" id="ipt_senha" placeholder="********">
                    </div>

                    <div class="espaco">
                        <label>CONFIRMAR SENHA</label>
                        <input type="password" id="ipt_confirmacaoSenha" placeholder="********">
                    </div>
                </div>

                <label class="labelRadio">ESCOLHA SUA FOTO DE PERFIL</label>
                <div class="fotoPerfil-selector">
                    <label class="fotoPerfil-item"><input type="radio" name="n_fotoPerfil" value="1"><img
                            src="./assets/imgs/profilePics/1.webp"></label>
                    <label class="fotoPerfil-item"><input type="radio" name="n_fotoPerfil" value="2"><img
                            src="./assets/imgs/profilePics/2.webp"></label>
                    <label class="fotoPerfil-item"><input type="radio" name="n_fotoPerfil" value="3"><img
                            src="./assets/imgs/profilePics/3.webp"></label>
                    <label class="fotoPerfil-item"><input type="radio" name="n_fotoPerfil" value="4"><img
                            src="./assets/imgs/profilePics/4.webp"></label>
                    <label class="fotoPerfil-item"><input type="radio" name="n_fotoPerfil" value="5"><img
                            src="./assets/imgs/profilePics/5.webp"></label>
                    <label class="fotoPerfil-item"><input type="radio" name="n_fotoPerfil" value="6"><img
                            src="./assets/imgs/profilePics/6.webp"></label>
                </div>

                <label id="div_validacao"></label>

                <button class="btnPrincipal_sign" onclick="cadastrar()">Cadastrar</button>
            </form>
            <p class="linkCadastro">Já possui uma conta? <a href="login.html">Entrar</a></p>
        </section>

        <section class="direitaContainer">
            <div class="direitaConteudo">
                <div class="detalheCadastro">
                    <span class="detalheCadastro01">ACESSO ILIMITADO</span>
                    <span class="detalheCadastro02">GESTÃO PREMIUM</span>
                </div>
                <h2>Domine o jogo, <span class="ballet" style="color: var(--accent-blue);">Colecione</span> lendas!</h2>
            </div>
        </section>
    </main>
</body>

</html>

<script>
    function cadastrar() {
        // ----- VARIAVEIS INPUTS: -----
        let username = ipt_username.value.trim();
        let email = ipt_email.value.trim();
        let senha = ipt_senha.value;
        let confirmacao = ipt_confirmacaoSenha.value;

        let numFotoPerfil = document.querySelector('input[name="n_fotoPerfil"]:checked')?.value;

        // ----- REGEX: -----
        let regexUsername = /^[a-zA-Z0-9_]{4,20}$/;
        let regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
        let regexSenha = /^(?=.*[A-Za-z])(?=.*\d).{6,}$/;

        // ----- VALIDAÇÕES: -----
        let condicoesErro = [
            username == "" || email == "" || senha == "" || confirmacao == "",
            !regexUsername.test(username),
            !regexEmail.test(email),
            !regexSenha.test(senha),
            confirmacao != senha,
            numFotoPerfil == undefined
        ];

        let mensagensErro = [
            "Preencha todos os campos para começar sua jornada!",
            "Seu nome de treinador deve ter de 4 a 20 caracteres (letras, números e _).",
            "Insira um e-mail válido (ex: treinador@pkmn.com).",
            "Sua senha deve ter no mínimo 6 caracteres, com letras e números.",
            "As senhas digitadas não coincidem.",
            "Escolha uma personagem para sua foto de perfil!"
        ];

        div_validacao.innerHTML = "";

        for (let i = 0; i < condicoesErro.length; i++) {
            if (condicoesErro[i]) {
                div_validacao.innerHTML = '<span class="msg-erro">' + mensagensErro[i] + '</span>';
                return false;
            }
        }

        // ----- IMPLEMENTAÇÃO API: -----
        let btnCadastro = document.querySelector(".btnPrincipal_sign");
        btnCadastro.disabled = true;
        btnCadastro.textContent = "Cadastrando...";

        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                usernameServer: username,
                emailServer: email,
                senhaServer: senha,
                confirmacaoServer: confirmacao,
                numFotoPerfilServer: numFotoPerfil
            }),
        })
            .then(function (resposta) {
                if (resposta.ok) {
                    div_validacao.innerHTML = "<span class='msg-sucesso'>Usuário cadastrado com sucesso!</span>";
                    setTimeout(() => {
                        window.location = "login.html";
                    }, 2000);
                } else {
                    return resposta.json().then(function (erro) {
                        div_validacao.innerHTML = "<span class='msg-erro'>" + (erro.mensagem || "Houve um erro ao tentar realizar o cadastro...") + "</span>";
                        btnCadastro.disabled = false;
                        btnCadastro.textContent = "Cadastrar";
                    });
                }
            })
            .catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
                div_validacao.innerHTML = "<span class='msg-erro'>Falha de conexão. Tente novamente.</span>";
                btnCadastro.disabled = false;
                btnCadastro.textContent = "Cadastrar";
            });

        return false;
    }
</script>
