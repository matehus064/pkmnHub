<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pkmnHub | Set</title>
    <link rel="icon" href="../assets/imgs/main/logo.png">
    <link rel="stylesheet" href="../css/shell.css">
    <link rel="stylesheet" href="../css/style_binder.css">
    <link rel="stylesheet" href="../css/dashboard_sets_view.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body onload="carregarSet()">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-container main-container-set-detalhe">

        <header id="header">
            <div class="header-left">
                <div class="header-search-group" style="font-size: 150%; font-weight: 900;">Sets</div>
                                <button class="btn-voltar btn-voltar--desktop" id="btn-voltar" title="Voltar">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
            </div>
            <div class="header-right">
                <span class="user-welcome">hey! <span id="username"></span></span>
            </div>
        </header>

        <div class="set-detalhe-scroll">
            <div class="set-banner">
                <div class="set-banner-bg" id="set-banner-bg"></div>
                <div class="set-banner-content">
                    <img class="set-banner-logo" id="set-logo" src="" alt="">
                    <div class="set-banner-info">
                        <div class="set-banner-nome">
                            <span id="set-nome-detalhe">—</span>
                            <span class="set-sigla-badge" id="set-sigla-badge"></span>
                        </div>
                        <div class="set-banner-meta" id="set-banner-meta"></div>
                    </div>
                </div>
            </div>

            <div class="progresso-wrapper">
                <div class="progresso-texto">
                    <div class="progresso-numero">
                        <span id="prog-coletadas">0</span>
                        <span> / <span id="prog-total">0</span></span>
                    </div>
                    <div class="progresso-label">coletadas</div>
                </div>
                <div class="progresso-bar-wrapper">
                    <div class="progresso-bar" id="progresso-bar" style="width:0%"></div>
                </div>
                <div class="progresso-pct" id="progresso-pct">0%</div>
            </div>

            <div id="grid_set" class="grid-set-cartas"></div>
        </div>
    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/dados.js"></script>
    <script src="../js/dadosCartas.js"></script>
    <script src="../js/functions.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/auth_ui.js"></script>
    <script src="../js/perfil_nav.js"></script>


    <script>
        const params = new URLSearchParams(window.location.search);
        const setId = params.get('set') || '';
        const usuario = sessionStorage.getItem('ID_USER') || 'guest';

        const BASE_URL = '/cards'; // ajuste se necessário

        // Cache local da sessão para evitar chamadas repetidas
        let colecaoCache = {}; // { "numero_carta": { tem_normal, tem_reverse } }
        let cartasDoSet = [];

        function formatarData(str) {
            if (!str) return '';
            const [y, m, d] = str.split('/');
            return `${d}/${m}/${y}`;
        }

        const RARIDADES_COM_REVERSE = ['Common', 'Uncommon', 'Rare'];
        function temReverse(carta) { return RARIDADES_COM_REVERSE.includes(carta.rarity); }

        function getCheck(num, tipo) {
            const entry = colecaoCache[num];
            if (!entry) return false;
            return tipo === 'normal' ? !!entry.tem_normal : !!entry.tem_reverse;
        }

        function atualizarProgresso(cartas) {
            let coletadas = 0, total = 0;
            cartas.forEach(c => {
                total++;
                if (getCheck(c.number, 'normal')) coletadas++;
                if (temReverse(c)) {
                    total++;
                    if (getCheck(c.number, 'reverse')) coletadas++;
                }
            });
            const pct = total > 0 ? Math.round((coletadas / total) * 100) : 0;
            document.getElementById('prog-coletadas').textContent = coletadas;
            document.getElementById('prog-total').textContent = total;
            document.getElementById('progresso-bar').style.width = pct + '%';
            document.getElementById('progresso-pct').textContent = pct + '%';
        }

        async function carregarSet() {
            const setInfo = sets.find(s => s.apiId === setId);
            const cartas = bancoDados[setId];

            if (!cartas) {
                document.getElementById('grid_set').innerHTML =
                    `<p style="color:var(--text-secondary);font-size:14px;">Set não encontrado: <strong>${setId}</strong></p>`;
                return;
            }

            cartasDoSet = [...cartas].sort((a, b) => (a.number || 0) - (b.number || 0));

            const nome = setInfo ? (setInfo.nomeEn || setInfo.nomePt) : setId;
            document.title = `pkmnHub | ${nome}`;

            document.getElementById('set-logo').src = `https://images.scrydex.com/pokemon/${setId}-logo/logo`;
            document.getElementById('set-logo').alt = nome;
            document.getElementById('set-nome-detalhe').textContent = nome;
            document.getElementById('set-sigla-badge').textContent = setInfo?.sigla || setId.toUpperCase();

            const metaPartes = [];
            if (setInfo?.serie) metaPartes.push(setInfo.serie);
            metaPartes.push(`${cartas.length} cards`);
            if (setInfo?.dataLancamento) metaPartes.push(`Released ${setInfo.dataLancamento}`);
            document.getElementById('set-banner-meta').innerHTML =
                metaPartes.map((p, i) =>
                    `<span>${p}</span>${i < metaPartes.length - 1 ? '<span class="dot">•</span>' : ''}`
                ).join('');

            document.getElementById('set-banner-bg').style.backgroundImage =
                `url('../assets/imgs/sets/${setId}.webp')`;

            // Mostra grid com skeleton enquanto carrega
            renderizarCartas(cartasDoSet);

            // Busca coleção do backend
            try {
                const res = await fetch(`${BASE_URL}/buscarColecaoSet?usuarioServer=${encodeURIComponent(usuario)}&setId=${encodeURIComponent(setId)}`);
                const dados = await res.json();

                // Popula cache
                colecaoCache = {};
                dados.forEach(row => {
                    colecaoCache[row.numero_carta] = {
                        tem_normal: row.tem_normal,
                        tem_reverse: row.tem_reverse
                    };
                });
            } catch (e) {
                console.error('Erro ao buscar coleção do set:', e);
            }

            // Re-renderiza com os dados reais e atualiza progresso
            renderizarCartas(cartasDoSet);
            atualizarProgresso(cartasDoSet);
        }

        function renderizarCartas(cartas) {
            const grid = document.getElementById('grid_set');
            let html = '';
            cartas.forEach(carta => {
                const num = carta.number;
                const imgUrl = `https://images.scrydex.com/pokemon/${setId}-${num}/small`;
                const n = getCheck(num, 'normal');
                const r = getCheck(num, 'reverse');
                const reverse = temReverse(carta);

                html += `
                <div class="carta-set-card">
                    <div class="carta-set-img-wrapper ${n || r ? 'coletada' : ''}" id="wrap-${num}">
                        <a href="${gerarLinkLigaPokemon(carta)}" target="_blank">
                            <img class="carta-set-img" src="${imgUrl}" alt="${carta.name || num}"
                                loading="lazy" onerror="this.style.opacity='0.25'">
                        </a>
                    </div>
                    <div class="carta-set-numero">#${num} · ${carta.name || ''}</div>
                    <div class="carta-set-checks">
                        <label class="check-label ${reverse ? '' : 'check-label--full'}">
                            <input type="checkbox" ${n ? 'checked' : ''}
                                onchange="toggleCheck(${num}, 'normal', this.checked)">
                            <span class="check-box"><i class="fa-solid fa-check"></i></span>
                            <span class="check-text">${reverse ? 'Normal' : 'Foil'}</span>
                        </label>
                        ${reverse ? `
                        <label class="check-label">
                            <input type="checkbox" ${r ? 'checked' : ''}
                                onchange="toggleCheck(${num}, 'reverse', this.checked)">
                            <span class="check-box"><i class="fa-solid fa-check"></i></span>
                            <span class="check-text">Reverse</span>
                        </label>` : ''}
                    </div>
                </div>`;
            });
            grid.innerHTML = html;
        }

        async function toggleCheck(num, tipo, checked) {
            // Atualiza cache otimisticamente
            if (!colecaoCache[num]) colecaoCache[num] = { tem_normal: false, tem_reverse: false };
            if (tipo === 'normal') colecaoCache[num].tem_normal = checked;
            else colecaoCache[num].tem_reverse = checked;

            // Atualiza borda do wrapper imediatamente
            const wrap = document.getElementById(`wrap-${num}`);
            if (wrap) {
                const algumMarcado = colecaoCache[num].tem_normal || colecaoCache[num].tem_reverse;
                wrap.classList.toggle('coletada', algumMarcado);
            }

            // Atualiza barra de progresso
            if (cartasDoSet.length) atualizarProgresso(cartasDoSet);

            // Persiste no backend
            try {
                await fetch(`${BASE_URL}/salvarColecaoSet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuarioServer: usuario,
                        setId: setId,
                        numeroCarta: num,
                        temNormal: colecaoCache[num].tem_normal ? 1 : 0,
                        temReverse: colecaoCache[num].tem_reverse ? 1 : 0
                    })
                });
            } catch (e) {
                console.error('Erro ao salvar coleção:', e);
                // Rollback visual em caso de erro
                if (tipo === 'normal') colecaoCache[num].tem_normal = !checked;
                else colecaoCache[num].tem_reverse = !checked;
                renderizarCartas(cartasDoSet);
                atualizarProgresso(cartasDoSet);
            }
        }
    </script>
</html>
