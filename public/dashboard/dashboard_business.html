<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pkmnHub | Dashboard</title>
    <link rel="icon" href="../assets/imgs/main/logo.png">
    <link rel="stylesheet" href="../css/shell.css">
    <link rel="stylesheet" href="../css/dashboard_business.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-container">
        <header id="header">
            <div class="header-left">
                <div class="header-search-group" style="font-size: 150%; font-weight: 900;">Hub de Desempenho</div>
            </div>

            <div class="header-right">
                <span class="user-welcome">hey! <span id="username"></span></span>
            </div>
        </header>

        <div class="dashboard-flex-wrapper">
            <div class="col-left">
                <div class="card chart-main-card">
                    <div class="label">Valor estimado da coleção</div>
                    <div class="main-value" id="valorTotalColecao"></div>

                    <div class="chart-filters">
                        <button class="btn-filter active" onclick="buscarKpis('30 DAY', this)">30 Dias</button>
                        <button class="btn-filter" onclick="buscarKpis('3 MONTH', this)">3 Meses</button>
                        <button class="btn-filter" onclick="buscarKpis('6 MONTH', this)">6 Meses</button>
                        <button class="btn-filter" onclick="buscarKpis('1 YEAR', this)">1 Ano</button>
                    </div>

                    <div class="chart-wrapper">
                        <canvas id="myChart"></canvas>
                    </div>
                </div>

                <div class="card chart-main-card chart-main-card--compact">
                    <div class="label">COMPARATIVO (TOTAL)</div>
                    <div class="card card--canvas">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-right">
                <div class="card total-cards">
                    <div class="label">Total de cartas</div>
                    <div class="total-group-right">
                        <span class="total-number" id="totalCartas"></span>
                        <span class="label">Total</span>
                    </div>
                </div>

                <div class="card most-expensive">
                    <div class="most-expensive-content">
                        <div>
                            <div class="label">Carta mais cara</div>
                            <div class="carta-mais-cara-nome" id="cartaMaisCara"></div>
                        </div>
                        <div class="carta-mais-cara-valor" id="cartaMaisCaraValor"></div>
                    </div>
                    <div class="card-img-wrapper" id="cartaMaisCaraImg"></div>
                </div>

                <div class="row-inner">
                    <div class="card gasto-card">
                        <div class="label">Gasto</div>
                        <div class="kpi-valor" id="totalGasto"></div>
                    </div>
                    <div class="card retorno-card">
                        <div class="label">Retorno</div>
                        <div class="kpi-valor" id="totalRetorno"></div>
                    </div>
                </div>

                <div class="row-inner">
                    <div class="card chart-main-card chart-main-card--compact-wide">
                        <div class="label">COMPARATIVO (COLEÇÕES)</div>
                        <div class="card card--canvas">
                            <canvas id="meuGraficoRosca"></canvas>
                        </div>
                    </div>

                    <div class="row-inner row-inner--column">
                        <div class="card card--kpi-small">
                            <div class="label">ROI</div>
                            <div class="roi-value" id="roi"></div>
                        </div>

                        <div class="card card--action-center">
                            <button class="btn-legend" onclick="toggleLegenda(meuGraficoRosca)">EXIBIR LEGENDA</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/dados.js"></script>
<script src="../js/dadosCartas.js"></script>
<script src="../js/functions.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/auth_ui.js"></script>
<script src="../js/perfil_nav.js"></script>

<script>
    let meuGraficoLinhas = null;
    let meuGraficoBarras = null;
    let meuGraficoRosca = null;

    function mostrarErroDashboard(mensagem) {
        document.querySelectorAll('.dashboard-flex-wrapper .main-value, .dashboard-flex-wrapper .total-number, .dashboard-flex-wrapper .kpi-valor, .dashboard-flex-wrapper .roi-value')
            .forEach(function (el) { el.innerHTML = '--'; });
        console.log(mensagem);
    }

    function buscarKpis(intervalo = '30 DAY', botao) {
        document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
        if (botao) botao.classList.add('active');

        let usuario = sessionStorage.getItem("ID_USER");

        if (!usuario) {
            mostrarErroDashboard("Usuário não identificado (sessão expirada). Redirecionando para login...");
            window.location.href = "../pages/login.html";
            return;
        }

        fetch(`/kpis/buscarKpis?usuarioServer=${usuario}&intervaloServer=${intervalo}`)
            .then(function (resposta) {
                if (!resposta.ok) {
                    throw new Error("Falha ao buscar KPIs: HTTP " + resposta.status);
                }
                return resposta.json();
            })
            .then(function (json) {
                console.log(json);

                // ----- VALORES SEGUROS (fallback quando não há dados/coleção vazia) -----
                let valorTotalColecaoNum = (json.valorTotalColecao && json.valorTotalColecao[0] && json.valorTotalColecao[0].valor_total_colecao) || 0;
                let totalCartasNum = (json.totalCartas && json.totalCartas[0] && json.totalCartas[0].total_cartas_fisicas) || 0;
                let totalGastoNum = (json.totalGasto && json.totalGasto[0] && json.totalGasto[0].total_investido) || 0;
                let totalRetornoNum = (json.totalRetorno && json.totalRetorno[0] && json.totalRetorno[0].total_retorno) || 0;
                let valorCompraNum = (json.valorTotalCompra && json.valorTotalCompra[0] && json.valorTotalCompra[0].valor_total_compra) || 0;
                let cartaMaisCara = (json.cartaMaisCara && json.cartaMaisCara[0]) || null;

                valorTotalColecao.innerHTML = formatarBrl(valorTotalColecaoNum);
                totalCartas.innerHTML = totalCartasNum;

                if (cartaMaisCara) {
                    cartaMaisCara_span = cartaMaisCara; // não sobrescreve a variável do card, só clareza
                    document.getElementById("cartaMaisCara").innerHTML = cartaMaisCara.nome_pokemon + " - " + cartaMaisCara.set_nome;
                    document.getElementById("cartaMaisCaraImg").style.backgroundImage = `url(${cartaMaisCara.url_imagem})`;
                    cartaMaisCaraValor.innerHTML = formatarBrl(cartaMaisCara.preco_ligaPkmn);
                } else {
                    document.getElementById("cartaMaisCara").innerHTML = "Nenhuma carta ainda";
                    document.getElementById("cartaMaisCaraImg").style.backgroundImage = "";
                    cartaMaisCaraValor.innerHTML = formatarBrl(0);
                }

                totalGasto.innerHTML = formatarBrl(totalGastoNum);
                totalRetorno.innerHTML = formatarBrl(totalRetornoNum);

                // ----- ROI (protegido contra divisão por zero) -----
                let roiCalculado = totalGastoNum > 0
                    ? ((totalRetornoNum - totalGastoNum) / totalGastoNum * 100)
                    : 0;
                roi.innerHTML = roiCalculado.toFixed(0) + "%";

                // --- LÓGICA DE COR APLICADA EXCLUSIVAMENTE NO ELEMENTO #ROI ---
                if (roiCalculado >= 0) {
                    roi.style.color = 'var(--accent-green)';
                } else if (roiCalculado > -20) {
                    roi.style.color = 'var(--accent-yellow)';
                } else {
                    roi.style.color = 'var(--accent-red)';
                }

                // ----- GRÁFICO DE LINHA -----
                let evolucaoColecao = json.evolucaoColecao || [];
                let labelsLinha = evolucaoColecao.map(item =>
                    new Date(item.data_snapshot).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })
                );
                let dadoslinha = evolucaoColecao.map(item => item.valor_total);

                if (meuGraficoLinhas) meuGraficoLinhas.destroy();

                const ctx = document.getElementById('myChart').getContext('2d');
                meuGraficoLinhas = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labelsLinha,
                        datasets: [{
                            label: 'Valor da Coleção',
                            data: dadoslinha,
                            borderColor: '#F9CF30',
                            tension: 0.5,
                            pointRadius: 0,
                            pointHoverRadius: 5,
                            borderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                                align: 'end',
                                labels: { color: '#808fa5', usePointStyle: false, boxWidth: 4, boxHeight: 4 }
                            }
                        },
                        scales: {
                            x: { ticks: { color: '#808fa5' }, grid: { color: 'rgba(255,255,255,0.08)' } },
                            y: {
                                ticks: {
                                    color: '#808fa5',
                                    callback: function (value) { return 'R$ ' + value.toLocaleString('pt-BR'); }
                                },
                                grid: { color: 'rgba(255,255,255,0.08)' }
                            }
                        }
                    }
                });

                // ----- GRÁFICO DE BARRAS -----
                if (meuGraficoBarras) meuGraficoBarras.destroy();

                const ctxBar = document.getElementById('barChart').getContext('2d');
                meuGraficoBarras = new Chart(ctxBar, {
                    type: 'bar',
                    data: {
                        labels: ['VALOR REAL', 'VALOR DE COMPRA'],
                        datasets: [{ data: [valorTotalColecaoNum, valorCompraNum], backgroundColor: '#F9CF30', barThickness: 20 }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { ticks: { color: '#808fa5' }, grid: { color: 'rgba(255,255,255,0.08)' } },
                            y: { ticks: { color: '#808fa5' }, grid: { color: 'rgba(255,255,255,0.08)' } }
                        }
                    }
                });

                // ----- GRÁFICO DE ROSCA -----
                let valorPorSet = json.valorPorSet || [];
                let labelsRosca = valorPorSet.map(item => {
                    let set = sets.find(s => s.nomePt === item.set_nome || s.nomeEn === item.set_nome);
                    return set ? set.sigla : item.set_nome;
                });
                let dadosRosca = valorPorSet.map(item => item.total_valor);
                let coresRosca = valorPorSet.map(item => {
                    let set = sets.find(s => s.nomePt === item.set_nome || s.nomeEn === item.set_nome);
                    return set ? set.cor : '#808fa5';
                });

                if (meuGraficoRosca) meuGraficoRosca.destroy();

                const ctxRosca = document.getElementById('meuGraficoRosca').getContext('2d');
                meuGraficoRosca = new Chart(ctxRosca, {
                    type: 'doughnut',
                    data: {
                        labels: labelsRosca,
                        datasets: [{ data: dadosRosca, backgroundColor: coresRosca, borderWidth: 0, hoverOffset: 5 }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: { padding: 5 },
                        plugins: {
                            legend: {
                                position: 'right',
                                display: false,
                                labels: { color: '#808fa5', font: { size: 9 }, boxWidth: 9, padding: 10 }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function (context) {
                                        let sigla = context.label;
                                        let set = sets.find(s => s.sigla === sigla);
                                        let nomeCompleto = set ? set.nomePt : sigla;
                                        let valor = formatarBrl(context.parsed);
                                        return `${nomeCompleto}: ${valor}`;
                                    }
                                }
                            },
                            datalabels: { display: true }
                        },
                        cutout: '65%'
                    }
                });
            })
            .catch(function (erro) {
                mostrarErroDashboard(erro);
            });
    }

    document.addEventListener('DOMContentLoaded', function () {
        buscarKpis('30 DAY', document.querySelector('.btn-filter'));
    });
</script>
