<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pkmnHub | Login</title>
    <link rel="icon" href="./assets/imgs/main/logo.png">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bodyCadastro" style="--accent-blue: var(--accent-red);">
    <main class="cadastroContainer">
        <section class="esquerdaContainer">
            <div class="direitaConteudo">
                <div class="detalheCadastro">
                    <span class="detalheCadastro01">ACESSO ILIMITADO</span>
                    <span class="detalheCadastro02">GESTÃO PREMIUM</span>
                </div>
                <h2>Domine o jogo, <span class="destaqueTexto" style="color: var(--accent-red);">Colecione</span>
                    lendas!</h2>
            </div>
        </section>

        <section class="formularioCadastro">
            <div class="logo logo--form">
                <img src="./assets/imgs/main/logo.png">
                <a href="index.html">pkmnHub</a>
            </div>

            <div class="welcome-text">
                <h1>Continue sua Jornada</h1>
                <p>Seus Pokémons estão a espera!</p>
            </div>

            <form onsubmit="return false;">
                <label>E-MAIL</label>
                <input type="text" id="ipt_email" placeholder="nome@exemplo.com">

                <label>SENHA</label>
                <input type="password" id="ipt_senha" placeholder="********">

                <label id="div_validacao"></label>

                <button type="submit" class="btnPrincipal_sign" onclick="login()">Entrar</button>
            </form>

            <p class="linkCadastro">Não possui uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </section>
    </main>
</body>

</html>

<script>
    function login() {
        let email = ipt_email.value.trim();
        let senha = ipt_senha.value;

        let regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

        if (email == "" || senha == "") {
            div_validacao.innerHTML = '<span class="msg-erro">Preencha todos os campos para começar sua jornada!</span>';
            return false;
        }

        if (!regexEmail.test(email)) {
            div_validacao.innerHTML = '<span class="msg-erro">Insira um e-mail válido (ex: treinador@pkmn.com).</span>';
            return false;
        }

        div_validacao.innerHTML = "";

        let btnLogin = document.querySelector(".btnPrincipal_sign");
        btnLogin.disabled = true;
        btnLogin.textContent = "Entrando...";

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    sessionStorage.EMAIL_USER = json.usernameServer;
                    sessionStorage.USERNAME = json.usernameServer;
                    sessionStorage.ID_USER = json.id;
                    sessionStorage.PROFILE_PIC = json.numFotoPerfilServer;

                    setTimeout(function () {
                        window.location = "./dashboard/dashboard_business.html";
                    }, 1000);
                });
            } else {
                resposta.text().then(texto => {
                    console.error(texto);
                    div_validacao.innerHTML = "<span class='msg-erro'>E-mail ou senha incorretos.</span>";
                    btnLogin.disabled = false;
                    btnLogin.textContent = "Entrar";
                });
            }
        }).catch(function (erro) {
            console.error(erro);
            div_validacao.innerHTML = "<span class='msg-erro'>Falha de conexão. Tente novamente.</span>";
            btnLogin.disabled = false;
            btnLogin.textContent = "Entrar";
        });

        return false;
    }
</script>
