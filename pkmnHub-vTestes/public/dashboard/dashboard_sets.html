<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pkmnHub | Sets</title>
    <link rel="icon" href="../assets/imgs/main/logo.png">
    <link rel="stylesheet" href="../css/style_dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body onload="carregarSets()">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-container main-container-sets">
        <header id="header">
            <div class="header-left">
                <div class="header-search-group" style="font-size: 150%; font-weight: 900;">Sets</div>
            </div>
            <div class="header-right">
                <span class="user-welcome">hey! <span id="username"></span></span>
            </div>
        </header>

        <div class="sets-scroll-area">
            <div id="sets-container" class="sets-container"></div>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/dados.js"></script>
    <script src="../js/dadosCartas.js"></script>
    <script src="../js/functions.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/auth_ui.js"></script>
    <script src="../js/perfil_nav.js"></script>


    <script>
        const OCULTOS = ['me5', 'INDISPONIVEL'];

        function formatarData(str) {
            if (!str) return '';
            const [y, m, d] = str.split('/');
            return `${d}/${m}/${y}`;
        }

        function carregarSets() {
            const container = document.getElementById('sets-container');

            const porSerie = {};
            sets.forEach(set => {
                if (OCULTOS.includes(set.apiId)) return;
                if (!set.serie) return;
                if (!porSerie[set.serie]) porSerie[set.serie] = [];
                porSerie[set.serie].push(set);
            });

            const ordemSeries = ['Mega Evolution', 'Scarlet & Violet', 'Sword & Shield', 'Sun & Moon'];
            const seriesOrdenadas = Object.keys(porSerie).sort((a, b) => {
                const ia = ordemSeries.indexOf(a);
                const ib = ordemSeries.indexOf(b);
                if (ia === -1 && ib === -1) return a.localeCompare(b);
                if (ia === -1) return 1;
                if (ib === -1) return -1;
                return ia - ib;
            });

            let html = '';
            seriesOrdenadas.forEach(serie => {
                const lista = porSerie[serie].sort((a, b) =>
                    (b.dataLancamento || '').localeCompare(a.dataLancamento || '')
                );

                html += `<div class="sets-serie-titulo">${serie}</div><div class="sets-grid">`;
                lista.forEach(set => {
                    const logoUrl = `https://images.scrydex.com/pokemon/${set.apiId}-logo/logo`;
                    const nome = set.nomeEn || set.nomePt || set.apiId;

                    html += `
                        <a class="set-item" href="dashboard_sets_view.html?set=${set.apiId}">
                            <img class="set-item-logo" src="${logoUrl}" alt="${nome}"
                                onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
                            <span class="set-item-logo-fallback">${nome}</span>
                            <span class="set-item-nome">${nome}</span>
                        </a>`;
                });
                html += `</div>`;
            });

            container.innerHTML = html || '<p style="color:var(--text-secondary);font-size:14px;">Nenhum set encontrado.</p>';
        }
    </script>
</html>
