<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pkmnHub | Dashboard</title>
    <link rel="icon" href="../assets/imgs/main/logo.png">
    <link rel="stylesheet" href="../css/style_dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<style>
    .kpi-row {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
    }

    .kpi-row .card {
        flex: 1;
    }

    .charts-row {
        display: flex;
        gap: 1rem;
    }

    .chart-main-card--line {
        flex: 2;
    }

    .chart-main-card--donut {
        flex: 1;
    }
</style>

<body>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-container">
        <header id="header">
            <div class="header-left">
                <div class="header-search-group" style="font-size: 150%; font-weight: 900;">Hub de Desempenho</div>
            </div>
            <div class="header-right">
                <span class="user-welcome">hey! <span id="username"></span></span>
            </div>
        </header>

        <div class="kpi-row">
            <div class="card total-cards">
                <div class="label">Total de cartas</div>
                <div class="total-group-right">
                    <span class="total-number" id="totalCartas"></span>
                    <span class="label">Total</span>
                </div>
            </div>

            <div class="card most-expensive">
                <div class="most-expensive-content">
                    <div>
                        <div class="label">Carta mais cara</div>
                        <div class="carta-mais-cara-nome" id="cartaMaisCara"></div>
                    </div>
                    <div class="carta-mais-cara-valor" id="cartaMaisCaraValor"></div>
                </div>
                <div class="card-img-wrapper" id="cartaMaisCaraImg"></div>
            </div>

            <div class="card card--kpi-small">
                <div class="label">ROI</div>
                <div class="roi-value" id="roi"></div>
            </div>
        </div>

        <div class="charts-row">
            <div class="card chart-main-card chart-main-card--line">
                <div class="label">Valor estimado da coleção</div>
                <div class="main-value" id="valorTotalColecao"></div>
                <div class="chart-filters">
                    <button class="btn-filter active" onclick="buscarKpis('30 DAY', this)">30 Dias</button>
                    <button class="btn-filter" onclick="buscarKpis('3 MONTH', this)">3 Meses</button>
                    <button class="btn-filter" onclick="buscarKpis('6 MONTH', this)">6 Meses</button>
                    <button class="btn-filter" onclick="buscarKpis('1 YEAR', this)">1 Ano</button>
                </div>
                <div class="chart-wrapper">
                    <canvas id="myChart"></canvas>
                </div>
            </div>

            <div class="card chart-main-card chart-main-card--donut">
                <div class="label">Comparativo (Gasto vs Venda)</div>
                <div class="chart-wrapper">
                    <canvas id="meuGraficoRosca"></canvas>
                </div>
            </div>
        </div>
    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/functions.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/auth_ui.js"></script>

<script>
    let meuGraficoLinhas = null;
    let meuGraficoRosca = null;

    function buscarKpis(intervalo = '30 DAY', botao) {
        document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
        if (botao) botao.classList.add('active');

        const usuario = sessionStorage.getItem("ID_USER");

        fetch(`/kpis/buscarKpis?usuarioServer=${usuario}&intervaloServer=${intervalo}`)
            .then(res => res.json())
            .then(json => {
                // KPIs
                valorTotalColecao.innerHTML = formatarBrl(json.valorTotalColecao[0].valor_total_colecao);
                totalCartas.innerHTML = json.totalCartas[0].total_cartas_fisicas;
                cartaMaisCara.innerHTML = json.cartaMaisCara[0].nome_pokemon + " - " + json.cartaMaisCara[0].set_nome;
                cartaMaisCaraValor.innerHTML = formatarBrl(json.cartaMaisCara[0].preco_ligaPkmn);
                document.getElementById("cartaMaisCaraImg").style.backgroundImage = `url(${json.cartaMaisCara[0].url_imagem})`;

                const roiValor = ((json.totalRetorno[0].total_retorno - json.totalGasto[0].total_investido) / json.totalGasto[0].total_investido * 100).toFixed(0);
                roi.innerHTML = roiValor + "%";
                roi.style.color = roiValor >= 0 ? 'var(--accent-green)' : roiValor > -20 ? 'var(--accent-yellow)' : 'var(--accent-red)';

                // Gráfico de linha
                if (meuGraficoLinhas) meuGraficoLinhas.destroy();
                meuGraficoLinhas = new Chart(document.getElementById('myChart').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: json.evolucaoColecao.map(i => new Date(i.data_snapshot).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })),
                        datasets: [{
                            label: 'Valor da Coleção',
                            data: json.evolucaoColecao.map(i => i.valor_total),
                            borderColor: '#F9CF30',
                            tension: 0.5,
                            pointRadius: 0,
                            pointHoverRadius: 5,
                            borderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                                align: 'end',
                                labels: { color: '#808fa5', usePointStyle: false, boxWidth: 4, boxHeight: 4 }
                            }
                        },
                        scales: {
                            x: { ticks: { color: '#808fa5' }, grid: { color: 'rgba(255,255,255,0.08)' } },
                            y: {
                                ticks: { color: '#808fa5', callback: v => 'R$ ' + v.toLocaleString('pt-BR') },
                                grid: { color: 'rgba(255,255,255,0.08)' }
                            }
                        }
                    }
                });

                // Gráfico de rosca
                if (meuGraficoRosca) meuGraficoRosca.destroy();
                meuGraficoRosca = new Chart(document.getElementById('meuGraficoRosca').getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Gasto', 'Venda'],
                        datasets: [{
                            data: [json.totalGasto[0].total_investido, json.totalRetorno[0].total_retorno],
                            backgroundColor: ['#EE3D2D', '#2ecc71'],
                            borderWidth: 0,
                            hoverOffset: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: { padding: 5 },
                        plugins: {
                            legend: {
                                position: 'bottom',
                                display: true,
                                labels: { color: '#808fa5', font: { size: 10 }, boxWidth: 10, padding: 12 }
                            },
                            tooltip: {
                                callbacks: {
                                    label: ctx => `${ctx.label}: ${formatarBrl(ctx.parsed)}`
                                }
                            }
                        },
                        cutout: '65%'
                    }
                });
            })
            .catch(console.error);
    }

    document.addEventListener('DOMContentLoaded', () => buscarKpis('30 DAY', document.querySelector('.btn-filter')));
</script>

</html>
